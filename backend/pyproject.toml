[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-server-monitor"
version = "0.9.1"
description = "AI-powered read-only server monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "httpx2>=2.16,<3",
    "prometheus-client>=0.20,<1",
    "pydantic-ai-slim[openai,mcp]>=2.70,<3",
    "tzdata>=2024.1",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=22.8,<23",
    "pyromark>=0.10.6",
    "telegramify-markdown>=1.4.2,<2",
    "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
ai-server-monitor = "ai_server_monitor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_server_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "B027",      # optional no-op hooks on ABCs are intentional
    "ASYNC109",  # timeout params on subprocess helpers are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]
