[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-server-monitor"
version = "0.6.7"
description = "AI-powered read-only server monitor with *arr stack automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "jmespath>=1.0",
    "psutil>=6.0",
    "dbus-fast>=2.0",
    "nvidia-ml-py>=12.535",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
ai-server-monitor = "ai_server_monitor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_server_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",
    "B027",      # optional no-op hooks on ABCs are intentional
    "ASYNC109",  # timeout params on subprocess helpers are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]
"tests/test_collector_system.py" = ["E501"]  # verbatim /proc fixture text
