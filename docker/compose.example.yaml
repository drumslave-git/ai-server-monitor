# AI Server Monitor. Everything else is configured in the web UI (http://<server>:8080).

services:
  ai-server-monitor:
    image: ghcr.io/drumslave-git/ai-server-monitor:latest
    container_name: ai-server-monitor
    restart: unless-stopped
    pid: host                            # see the host's processes (ps, top)
    security_opt:
      - apparmor=unconfined              # else Ubuntu's AppArmor blocks reading other processes under /proc
    cap_add:
      - DAC_READ_SEARCH                  # the chat's read-only shell may read root-only files
      # Changing commands you approve in chat (restart a container, delete files) run as root on
      # the host via nsenter into PID 1's namespaces, which needs both of these; without them the
      # chat only reads (Settings → Approvals → shell changes, and /api/status, say so).
      # - SYS_ADMIN
      # - SYS_PTRACE
    ports:
      - "8080:8080"
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - ./data:/data                     # settings + history
      - /:/host:ro,rslave                # host filesystem, read-only
    # gpus: all                          # NVIDIA GPU visible to the shell (needs the NVIDIA container runtime)
    depends_on:
      - docker-proxy

  # Read-only Docker API (GET requests only).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: ai-server-monitor-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      SYSTEM: 1
      DISTRIBUTION: 1                    # the image update check asks the registry's digest through Docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
