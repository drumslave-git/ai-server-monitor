# AI Server Monitor — example configuration.
# Copy to config.yaml (mounted at /config/config.yaml in the container).
#
# ${VAR} and ${VAR:-default} are replaced from the environment. If VAR is unset but
# VAR_FILE is set, the file's content is used (Docker secrets).
# Any value can also be overridden with env vars: ASM__SECTION__KEY, e.g. ASM__LLM__MODEL.
# Durations accept 500ms, 15s, 5m, 6h, 30d, 1h30m or plain seconds.

server:
  host: 0.0.0.0
  port: 8080
  log_level: info

llm:
  # Any OpenAI-compatible endpoint: Ollama, llama.cpp, vLLM, LM Studio, OpenRouter, OpenAI...
  base_url: ${LLM_BASE_URL:-http://localhost:11434/v1}
  api_key: ${LLM_API_KEY:-}
  model: ${LLM_MODEL:-qwen2.5:14b}
  # auto = probe the model at startup; native = OpenAI tool calls; json = JSON-in-text
  # fallback for models without tool calling; none = no tools (chat answers from data only).
  tool_mode: auto
  # Ollama note: its OpenAI endpoint uses the server's default context window. Set
  # OLLAMA_CONTEXT_LENGTH (or a Modelfile num_ctx) to at least max_context_tokens.
  max_context_tokens: 8192
  max_output_tokens: 1500
  temperature: 0.2
  timeout: 3m
  max_retries: 2
  stream_usage: true
  extra_body: {}

report:
  interval: 5m
  skip_if_unchanged: false
  language: en

storage:
  path: /data/monitor.db
  retention: 30d
  sample_interval: 5m   # history resolution; live data is always fresh

collectors:
  # enabled: true | false | auto (auto = silently skip if the source isn't present)
  host_root: /host      # host / mounted read-only here; falls back to / when missing
  system:  { enabled: true, interval: 15s, top_n: 10 }
  docker:
    enabled: true
    interval: 30s
    url: null           # default $DOCKER_HOST or unix:///var/run/docker.sock
    log_scan: true      # count error lines in container logs since the last run
    log_tail: 300
    df_interval: 30m
  gpu:     { enabled: auto, interval: 30s }
  systemd: { enabled: true, interval: 1m }   # bus_address: unix:path=...
  journal:
    enabled: true
    interval: 1m
    priority: warning   # emerg|alert|crit|err|warning|notice|info
    max_entries: 2000
    initial_lookback: 1h
  apt:           { enabled: true, interval: 6h }
  image_updates: { enabled: true, interval: 12h }
  prometheus:
    enabled: false
    url: http://prometheus:9090
    queries: {}
    #   node_load: 'node_load5'

outputs:
  telegram:
    enabled: false
    token: ${TELEGRAM_TOKEN:-}
    allowed_chat_ids: []
    report_every: 1   # every Nth report; 0 = alerts only
  metrics:
    enabled: true

arr:
  dry_run: true       # nothing is changed until this is false
  radarr: []
  #  - { name: radarr, url: http://radarr:7878, api_key: "${RADARR_KEY}" }
  sonarr: []
  #  - { name: sonarr, url: http://sonarr:8989, api_key: "${SONARR_KEY}" }
  whisparr: []
  prowlarr: null
  #  { name: prowlarr, url: http://prowlarr:9696, api_key: "${PROWLARR_KEY}" }
  qbittorrent: null
  #  { url: http://qbittorrent:8080, username: admin, password: "${QBIT_PASS}" }
  actions:
    # policy: off | suggest | approve | auto
    stalled_cleanup: { policy: approve, stalled_after: 6h, max_per_hour: 10 }
    missing_search:  { policy: suggest, interval: 6h, batch: 10 }
    cutoff_search:   { policy: suggest, interval: 24h, batch: 5 }
    add_media:       { policy: approve }
    indexer_triage:  { policy: suggest }
    approval_ttl: 24h
